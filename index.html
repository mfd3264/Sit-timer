<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0C10">
<title>SIT Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --surface:#14171D;
    --surface-2:#1B1F27;
    --text:#F5F6F7;
    --muted:#6B7280;
    --track:#22262E;
    --sprint:#FF4B3E;
    --weights:#3E8FB0;
    --transition:#F2A93B;
    --prepare:#8B7FD9;
    --done:#34C77B;
    --danger:#FF4B3E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  #app{width:100%; max-width:480px; height:100vh; height:100dvh; display:flex; flex-direction:column;}
  .screen{flex:1; display:flex; flex-direction:column; padding:20px 20px 24px;}
  .hidden{display:none !important;}

  /* ---------- Setup screen ---------- */
  .setup-header{display:flex; align-items:baseline; justify-content:space-between; margin:8px 4px 20px;}
  .setup-header h1{font-size:22px; font-weight:700; margin:0; letter-spacing:0.02em;}
  .setup-header span{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em;}

  .field-list{display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1;}
  .field{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field-label{display:flex; flex-direction:column; gap:2px;}
  .field-label .name{font-size:17px; font-weight:600;}
  .field-label .hint{font-size:13px; color:var(--muted);}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:40px; height:40px; border-radius:11px; border:none;
    background:var(--surface-2); color:var(--text); font-size:22px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{background:#262B34;}
  .stepper .val{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:19px;
    min-width:64px; text-align:center; font-variant-numeric:tabular-nums;
  }

  .toggle-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
  .switch{
    width:44px; height:26px; border-radius:20px; background:var(--surface-2); position:relative; flex-shrink:0;
    transition:background 0.15s;
  }
  .switch::after{
    content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:var(--muted); transition:transform 0.15s, background 0.15s;
  }
  .switch.on{background:rgba(52,199,123,0.25);}
  .switch.on::after{transform:translateX(18px); background:var(--done);}

  .start-btn{
    margin-top:16px;
    background:var(--done);
    color:#062012;
    border:none;
    border-radius:18px;
    padding:18px;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.02em;
    font-family:'Space Grotesk',sans-serif;
  }
  .start-btn:active{opacity:0.85;}

  /* ---------- Timer screen ---------- */
  .timer-top{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 6px;}
  .top-btn{
    background:none; border:none; color:var(--muted); font-size:13px; font-weight:600;
    letter-spacing:0.08em; padding:8px; font-family:'Space Grotesk',sans-serif;
  }
  .top-btn.danger-confirm{color:var(--danger);}

  .ring-wrap{
    position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .ring-svg{width:min(84vw,360px); height:min(84vw,360px); transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--track); stroke-width:14;}
  .ring-progress{fill:none; stroke-width:14; stroke-linecap:round; transition:stroke 0.3s ease;}
  .ring-center{
    position:absolute; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .phase-label{
    font-size:17px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
    transition:color 0.3s ease;
  }
  .phase-time{
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:80px;
    font-variant-numeric:tabular-nums; line-height:1;
  }
  .cycle-tag{font-size:15px; color:var(--muted); font-weight:600; letter-spacing:0.05em;}

  .stats-bar{
    display:flex; justify-content:space-between; background:var(--surface);
    border-radius:14px; padding:12px 18px; margin:12px 0 18px;
  }
  .stat{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .stat .stat-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums;}
  .stat .stat-label{font-size:11px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase;}

  .controls{display:flex; align-items:center; justify-content:center; gap:22px;}
  .ctrl-btn{
    border:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--text);
  }
  .ctrl-btn.secondary{width:56px; height:56px;}
  .ctrl-btn.secondary svg{width:22px; height:22px;}
  .ctrl-btn.primary{width:82px; height:82px; background:var(--text); color:var(--bg);}
  .ctrl-btn.primary svg{width:30px; height:30px;}
  .ctrl-btn:active{opacity:0.8;}

  /* ---------- Done screen ---------- */
  .done-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;}
  .done-wrap .big{font-size:26px; font-weight:700; color:var(--done);}
  .done-wrap .sub{font-size:14px; color:var(--muted);}
  .done-wrap .time{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:40px; margin:10px 0;}
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen">
    <div class="setup-header">
      <h1>Sprint Intervals</h1>
      <span>Setup</span>
    </div>
    <div class="field-list" id="field-list"></div>
    <button class="start-btn" id="start-btn">Start Workout</button>
  </div>

  <!-- TIMER SCREEN -->
  <div id="timer-screen" class="screen hidden">
    <div class="timer-top">
      <button class="top-btn" id="end-btn">END</button>
      <button class="top-btn" id="mute-btn">SOUND ON</button>
    </div>
    <div class="ring-wrap">
      <svg class="ring-svg" id="ring-svg" viewBox="0 0 300 300">
        <circle class="ring-track" cx="150" cy="150" r="130"></circle>
        <circle class="ring-progress" id="ring-progress" cx="150" cy="150" r="130"></circle>
      </svg>
      <div class="ring-center">
        <div class="phase-label" id="phase-label">PREPARE</div>
        <div class="phase-time" id="phase-time">0:10</div>
        <div class="cycle-tag" id="cycle-tag">GET READY</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-val" id="elapsed-val">0:00</div><div class="stat-label">Elapsed</div></div>
      <div class="stat"><div class="stat-val" id="remaining-val">0:00</div><div class="stat-label">Remaining</div></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn secondary" id="skip-btn" title="Skip to next phase">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l10 7-10 7V5zM18 5h2v14h-2V5z"/></svg>
      </button>
      <button class="ctrl-btn primary" id="pause-btn" title="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" id="pause-icon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div style="width:56px;"></div>
    </div>
  </div>

  <!-- DONE SCREEN -->
  <div id="done-screen" class="screen hidden">
    <div class="done-wrap">
      <div class="big">Workout Complete</div>
      <div class="time" id="done-time">28:38</div>
      <div class="sub" id="done-sub">6 cycles &middot; sprint + weights</div>
    </div>
    <button class="start-btn" id="done-restart-btn">New Workout</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var DEFAULTS = { prepare:10, sprint:30, transition:8, weights:240, cycles:6, sound:true, voice:false };
  var config = Object.assign({}, DEFAULTS);

  var FIELDS = [
    { key:'prepare', name:'Prepare', hint:'Countdown before the first sprint', min:0, max:60, step:5, fmt:'sec' },
    { key:'sprint', name:'Sprint', hint:'All-out effort on the bike', min:5, max:120, step:5, fmt:'sec' },
    { key:'transition', name:'Transition', hint:'Clip in / clip out buffer', min:0, max:30, step:1, fmt:'sec' },
    { key:'weights', name:'Weights', hint:'Strength block off the bike', min:30, max:600, step:15, fmt:'clock' },
    { key:'cycles', name:'Cycles', hint:'Sprint + weights repeated', min:1, max:20, step:1, fmt:'count' }
  ];

  function fmtVal(field){
    var v = config[field.key];
    if(field.fmt==='sec') return v+'s';
    if(field.fmt==='count') return String(v);
    return fmtClock(v);
  }

  function fmtClock(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec%60;
    if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return m+':'+String(s).padStart(2,'0');
  }

  function buildSetupUI(){
    var list = document.getElementById('field-list');
    list.innerHTML = '';
    FIELDS.forEach(function(field){
      var row = document.createElement('div');
      row.className = 'field';
      row.innerHTML =
        '<div class="field-label"><div class="name">'+field.name+'</div><div class="hint">'+field.hint+'</div></div>'+
        '<div class="stepper">'+
          '<button data-key="'+field.key+'" data-dir="-1" aria-label="decrease">-</button>'+
          '<div class="val" id="val-'+field.key+'">'+fmtVal(field)+'</div>'+
          '<button data-key="'+field.key+'" data-dir="1" aria-label="increase">+</button>'+
        '</div>';
      list.appendChild(row);
    });

    var soundRow = document.createElement('div');
    soundRow.className = 'field';
    soundRow.innerHTML =
      '<div class="field-label"><div class="name">Sound cues</div><div class="hint">Tones on phase change + 3-2-1 countdown</div></div>'+
      '<div class="toggle-row" style="width:auto;"><div class="switch on" id="toggle-sound"></div></div>';
    list.appendChild(soundRow);

    var voiceRow = document.createElement('div');
    voiceRow.className = 'field';
    voiceRow.innerHTML =
      '<div class="field-label"><div class="name">Voice announcements</div><div class="hint">Speaks the phase name aloud</div></div>'+
      '<div class="toggle-row" style="width:auto;"><div class="switch" id="toggle-voice"></div></div>';
    list.appendChild(voiceRow);

    list.querySelectorAll('.stepper button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var field = FIELDS.find(function(f){ return f.key===btn.dataset.key; });
        var dir = parseInt(btn.dataset.dir,10);
        var next = config[field.key] + dir*field.step;
        next = Math.min(field.max, Math.max(field.min, next));
        config[field.key] = next;
        document.getElementById('val-'+field.key).textContent = fmtVal(field);
      });
    });

    document.getElementById('toggle-sound').addEventListener('click', function(){
      config.sound = !config.sound;
      this.classList.toggle('on', config.sound);
    });
    document.getElementById('toggle-voice').addEventListener('click', function(){
      config.voice = !config.voice;
      this.classList.toggle('on', config.voice);
    });
  }

  /* ---------------- Phase engine ---------------- */

  var COLORS = { prepare:'#8B7FD9', sprint:'#FF4B3E', transition:'#F2A93B', weights:'#3E8FB0', done:'#34C77B' };
  var CYCLE_TAGS = { prepare:'GET READY', transition:'MOVE' };

  var phases = [];
  var totalDuration = 0;
  var phaseIndex = 0;
  var running = false;
  var paused = false;
  var wakeLock = null;
  var audioCtx = null;
  var beeped = {};
  var tickHandle = null;

  // Wall-clock model: everything derives from Date.now(), never from a running
  // tick count. This is what makes the timer immune to iOS suspending JS while
  // the app is backgrounded (switching to Apple Music, the app switcher, etc).
  // workoutStartAt is the moment Start was pressed. pausedAccumMs is total time
  // spent paused so far. adjustMs is a virtual offset applied by Skip so the
  // clock can jump without lying about real elapsed time.
  var workoutStartAt = null;
  var pausedAccumMs = 0;
  var pauseStartedAt = null;
  var adjustMs = 0;

  function buildPhases(cfg){
    var list = [];
    list.push({ type:'prepare', duration:cfg.prepare, label:'PREPARE', cycle:null });
    for(var c=1;c<=cfg.cycles;c++){
      list.push({ type:'sprint', duration:cfg.sprint, label:'SPRINT', cycle:c });
      list.push({ type:'transition', duration:cfg.transition, label:'TRANSITION', cycle:c });
      list.push({ type:'weights', duration:cfg.weights, label:'WEIGHTS', cycle:c });
      if(c<cfg.cycles){
        list.push({ type:'transition', duration:cfg.transition, label:'TRANSITION', cycle:c });
      }
    }
    list.push({ type:'done', duration:0, label:'DONE', cycle:null });
    var acc = 0;
    list.forEach(function(p){ p.startOffset = acc; acc += p.duration; });
    totalDuration = acc;
    return list;
  }

  function rawElapsedMs(){
    var now = paused ? pauseStartedAt : Date.now();
    return (now - workoutStartAt) - pausedAccumMs + adjustMs;
  }

  function elapsedTotalSec(){
    return Math.max(0, Math.min(totalDuration, rawElapsedMs()/1000));
  }

  function phaseAtElapsed(elapsedSec){
    for(var i=0;i<phases.length;i++){
      var p = phases[i];
      if(elapsedSec < p.startOffset + p.duration) return i;
    }
    return phases.length-1;
  }

  function currentRemainingSec(){
    var p = phases[phaseIndex];
    var remain = (p.startOffset + p.duration) - elapsedTotalSec();
    return Math.max(0, remain);
  }

  /* ---------------- Audio ---------------- */

  function ensureAudio(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }

  function tone(freq, startOffsetSec, durSec, waveType, peakVol){
    if(!config.sound || !audioCtx) return;
    var t0 = audioCtx.currentTime + startOffsetSec;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = waveType || 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakVol || 0.22, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+durSec);
    osc.start(t0);
    osc.stop(t0+durSec+0.03);
  }

  function playCountBeep(){
    tone(440, 0, 0.12, 'square', 0.2);
  }

  function playGoBeep(){
    tone(880, 0, 0.18, 'square', 0.26);
  }

  function playPhaseSound(type){
    if(type==='done'){ tone(523,0,0.16,'sine',0.26); tone(659,0.16,0.16,'sine',0.26); tone(784,0.32,0.32,'sine',0.28); }
    else { playGoBeep(); }
  }

  function speak(text){
    if(!config.voice || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------------- Wake lock ---------------- */

  function requestWakeLock(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(lock){
      wakeLock = lock;
    }).catch(function(){ /* non-fatal: battery saver, unsupported, etc */ });
  }

  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && running){
      if(!paused){
        syncPhase();
        render(currentRemainingSec());
        if(!wakeLock) requestWakeLock();
      }
    }
  });

  /* ---------------- Rendering ---------------- */

  var ringProgress = document.getElementById('ring-progress');
  var R = 130;
  var CIRC = 2*Math.PI*R;
  ringProgress.style.strokeDasharray = CIRC;

  var phaseLabelEl = document.getElementById('phase-label');
  var phaseTimeEl = document.getElementById('phase-time');
  var cycleTagEl = document.getElementById('cycle-tag');
  var elapsedValEl = document.getElementById('elapsed-val');
  var remainingValEl = document.getElementById('remaining-val');
  var pauseIcon = document.getElementById('pause-icon');
  var muteBtn = document.getElementById('mute-btn');

  function onPhaseEnter(p){
    phaseLabelEl.textContent = p.label;
    phaseLabelEl.style.color = COLORS[p.type] || '#F5F6F7';
    ringProgress.style.stroke = COLORS[p.type] || '#F5F6F7';
    cycleTagEl.textContent = (p.cycle!=null) ? ('CYCLE '+p.cycle+' / '+config.cycles) : (CYCLE_TAGS[p.type] || '');
    beeped = {};
    playPhaseSound(p.type);
    if(p.type!=='done') speak(p.label.charAt(0)+p.label.slice(1).toLowerCase());
    else speak('Workout complete');
  }

  function render(remainSec){
    var p = phases[phaseIndex];
    var frac = p.duration>0 ? (remainSec/p.duration) : 0;
    ringProgress.style.strokeDashoffset = CIRC*(1-frac);
    phaseTimeEl.textContent = fmtClock(Math.ceil(remainSec));
    elapsedValEl.textContent = fmtClock(elapsedTotalSec());
    remainingValEl.textContent = fmtClock(totalDuration - elapsedTotalSec());
  }

  /* ---------------- Engine control ---------------- */

  // Re-derives which phase we should be on from the wall clock and, if it
  // moved (including jumping past several phases after a long gap), fires
  // the enter-phase side effects for the phase we actually land on. This is
  // what runs on every tick AND immediately when the app comes back to the
  // foreground, so a suspended tab never leaves the UI stuck on a stale phase.
  function syncPhase(){
    var elapsed = elapsedTotalSec();
    var newIndex = phaseAtElapsed(elapsed);
    if(newIndex !== phaseIndex){
      var wasRunning = running;
      phaseIndex = newIndex;
      if(phases[phaseIndex].type==='done'){
        if(wasRunning) finishWorkout();
        return false;
      }
      onPhaseEnter(phases[phaseIndex]);
    }
    return true;
  }

  function tick(){
    if(!running || paused) return;
    if(!syncPhase()) return;
    var remain = currentRemainingSec();
    var remainInt = Math.ceil(remain);
    var p = phases[phaseIndex];
    if(remainInt<=3 && remainInt>=1 && p.type!=='done'){
      var key = phaseIndex+'-'+remainInt;
      if(!beeped[key]){ beeped[key]=true; playCountBeep(); }
    }
    render(remain);
  }

  function startWorkout(){
    phases = buildPhases(config);
    phaseIndex = 0;
    workoutStartAt = Date.now();
    pausedAccumMs = 0;
    pauseStartedAt = null;
    adjustMs = 0;
    running = true;
    paused = false;
    ensureAudio();
    requestWakeLock();
    showScreen('timer');
    onPhaseEnter(phases[0]);
    render(phases[0].duration);
    if(tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(tick, 100);
  }

  function togglePause(){
    if(!running) return;
    if(paused){
      pausedAccumMs += (Date.now() - pauseStartedAt);
      pauseStartedAt = null;
      paused = false;
      pauseIcon.innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
      requestWakeLock();
    } else {
      pauseStartedAt = Date.now();
      paused = true;
      pauseIcon.innerHTML = '<path d="M8 5l12 7-12 7z"/>';
    }
  }

  function skipPhase(){
    if(!running) return;
    var wasPaused = paused;
    if(wasPaused) togglePause(); // resume so the math below uses a live clock
    var boundary = (phases[phaseIndex].startOffset + phases[phaseIndex].duration) * 1000;
    adjustMs += boundary - rawElapsedMs();
    syncPhase();
    render(currentRemainingSec());
    if(wasPaused) togglePause(); // restore pause state if it was paused before skipping
  }

  function finishWorkout(){
    running = false;
    releaseWakeLock();
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    playPhaseSound('done');
    speak('Workout complete');
    document.getElementById('done-time').textContent = fmtClock(totalDuration);
    document.getElementById('done-sub').textContent = config.cycles+' cycles \u00b7 sprint + weights';
    showScreen('done');
  }

  var endConfirmPending = false;
  var endConfirmTimeout = null;
  function handleEnd(){
    var btn = document.getElementById('end-btn');
    if(!endConfirmPending){
      endConfirmPending = true;
      btn.textContent = 'TAP TO CONFIRM';
      btn.classList.add('danger-confirm');
      endConfirmTimeout = setTimeout(function(){
        endConfirmPending = false;
        btn.textContent = 'END';
        btn.classList.remove('danger-confirm');
      }, 3000);
      return;
    }
    clearTimeout(endConfirmTimeout);
    endConfirmPending = false;
    running = false;
    paused = false;
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    releaseWakeLock();
    var btn2 = document.getElementById('end-btn');
    btn2.textContent = 'END';
    btn2.classList.remove('danger-confirm');
    showScreen('setup');
  }

  /* ---------------- Screens ---------------- */

  function showScreen(name){
    document.getElementById('setup-screen').classList.toggle('hidden', name!=='setup');
    document.getElementById('timer-screen').classList.toggle('hidden', name!=='timer');
    document.getElementById('done-screen').classList.toggle('hidden', name!=='done');
  }

  /* ---------------- Wire up ---------------- */

  buildSetupUI();
  document.getElementById('start-btn').addEventListener('click', startWorkout);
  document.getElementById('done-restart-btn').addEventListener('click', function(){ showScreen('setup'); });
  document.getElementById('pause-btn').addEventListener('click', togglePause);
  document.getElementById('skip-btn').addEventListener('click', skipPhase);
  document.getElementById('end-btn').addEventListener('click', handleEnd);
  muteBtn.addEventListener('click', function(){
    config.sound = !config.sound;
    muteBtn.textContent = config.sound ? 'SOUND ON' : 'SOUND OFF';
  });

})();
</script>
</body>
